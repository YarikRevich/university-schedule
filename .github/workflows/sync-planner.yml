name: Sync FK Planer

on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours (UTC)
  workflow_dispatch: {}       # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: sync-planner
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download FK Planer and update data.json
        run: node scripts/sync-planner.mjs

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain -- data.json)" ]; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Sync timetable from FK Planer"
          git push
