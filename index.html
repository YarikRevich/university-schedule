/* Layout: one narrow reading column; a sticky week bar; each day is a date gutter + list of class rows. */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --fg:#161a22; --muted:#667085; --line:#e3e6ec;
  --accent:#2f5bd3; --accent-soft:#e7edfb;
  --warsz:#b4561f; --warsz-soft:#f8eadf; --czyz:#1d7a5a; --czyz-soft:#e0f1ea; --online:#6b6f7b; --online-soft:#eceef2;
  --wa:#2f5bd3; --wb:#a3478f; --wm:#c4322b; --wa-soft:#e7edfb; --wb-soft:#f7e9f4; --add:#1d7a5a; --del:#b42318;
  --d0:#eef2fb; --d1:#eef7f1; --d2:#fbf5e9; --d3:#f6effa; --d4:#fbefee;
  --sans:"Roboto",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1115; --surface:#171a21; --fg:#e8eaf0; --muted:#8b93a5; --line:#262b35;
  --accent:#86a4f5; --accent-soft:#1c2540;
  --warsz:#eb9a66; --warsz-soft:#35231a; --czyz:#5cc79e; --czyz-soft:#16302a; --online:#a2a8b6; --online-soft:#22262f;
  --wa:#86a4f5; --wb:#d98bc7; --wm:#f47c72; --wa-soft:#1c2540; --wb-soft:#2e1d2b; --add:#5cc79e; --del:#f97066; --d0:#182033; --d1:#16261f; --d2:#2a2418; --d3:#251c2e; --d4:#2c1d1d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1115; --surface:#171a21; --fg:#e8eaf0; --muted:#8b93a5; --line:#262b35;
  --accent:#86a4f5; --accent-soft:#1c2540;
  --warsz:#eb9a66; --warsz-soft:#35231a; --czyz:#5cc79e; --czyz-soft:#16302a; --online:#a2a8b6; --online-soft:#22262f;
  --wa:#86a4f5; --wb:#d98bc7; --wm:#f47c72; --wa-soft:#1c2540; --wb-soft:#2e1d2b; --add:#5cc79e; --del:#f97066; --d0:#182033; --d1:#16261f; --d2:#2a2418; --d3:#251c2e; --d4:#2c1d1d; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--sans);font-variant-numeric:tabular-nums;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:1.6rem;font-weight:700;letter-spacing:-.01em;margin:0;text-wrap:balance}
.gwrap{position:relative;display:inline-flex;align-items:center}
.gwrap::after{content:"";position:absolute;right:6px;top:50%;width:8px;height:8px;margin-top:-6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);pointer-events:none;opacity:.7}
.gsel{font:inherit;color:inherit;background:transparent;border:1px solid transparent;border-radius:8px;padding:0 28px 0 6px;margin-left:-7px;appearance:none;-webkit-appearance:none;cursor:pointer}
.gsel:hover{border-color:var(--line);background:var(--surface)}
.gsel:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gsel option,.gsel optgroup{font-size:1rem;font-weight:400;color:var(--fg);background:var(--surface)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sub{color:var(--muted);font-size:.85rem;margin-top:2px}
.pill{font-size:.75rem;padding:3px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
#curWeek,#curWeek.pA,#curWeek.pB{font-family:var(--sans);font-size:1rem;font-weight:400;padding:8px 16px;border-radius:10px;border:1px solid var(--muted);background:var(--surface);color:var(--fg)}
.pA{color:var(--wa)} .pB{color:var(--wb)} .pM{color:var(--wm);font-family:var(--sans);font-weight:400}
.btn{font:inherit;font-size:.85rem;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:16px}
.status{font-size:.78rem;color:var(--muted);flex-basis:100%}
.panel{margin-top:12px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;display:grid;gap:8px}
.panel h2{font-size:.95rem;font-weight:500;margin:0}
.panel p{margin:0;font-size:.85rem;color:var(--muted)}
.panel ul{margin:0;padding-left:18px;font-size:.82rem;display:grid;gap:2px}
.panel .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.add{color:var(--add)} .del{color:var(--del)}
.row{display:flex;gap:8px;flex-wrap:wrap}
dialog.modal{font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;width:min(560px,calc(100vw - 32px));max-height:min(80vh,720px);overflow:auto;background:var(--surface);color:var(--fg);box-shadow:0 20px 50px rgba(0,0,0,.25)}
dialog.modal::backdrop{background:rgba(15,17,21,.45)}
dialog.modal h2{font-size:1.05rem;font-weight:500;margin:0 0 4px}
dialog.modal p{margin:0 0 8px;font-size:.85rem;color:var(--muted)}
dialog.modal *{font-family:inherit}
dialog.modal ul{margin:0 0 10px;padding-left:18px;font-size:.84rem;display:grid;gap:3px}
dialog.modal .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:6px}
.tabs{display:flex;gap:4px;margin-top:20px;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-size:.9rem;background:none;border:0;border-bottom:2px solid transparent;padding:8px 10px;color:var(--muted);cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--fg)}
.weekbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:12px;border-bottom:1px solid var(--line)}
.weekbar .lbl{flex:1;min-width:0;text-align:center;font-size:.9rem}
.weekbar .lbl b{font-weight:500}
.weekbar .dates{display:block;font-size:.75rem;color:var(--muted)}
.arrow{width:36px;height:36px;padding:0;font-size:1.1rem;line-height:1}
#days{display:grid;gap:8px;padding-top:10px}
.day{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:14px 12px;border-radius:10px;background:var(--dbg)}
.day.dw0{--dbg:var(--d0)}.day.dw1{--dbg:var(--d1)}.day.dw2{--dbg:var(--d2)}.day.dw3{--dbg:var(--d3)}.day.dw4{--dbg:var(--d4)}
.day.today{box-shadow:inset 0 0 0 2px var(--accent)}
.day.today .dname{color:var(--accent)}
.dname{font-weight:500;font-size:.85rem}
.ddate{font-size:.75rem;color:var(--muted)}
.list{display:grid;gap:10px;min-width:0}
.cls{display:grid;grid-template-columns:92px 1fr;gap:10px;min-width:0}
.time{font-size:.8rem;padding-top:1px}
.time small{display:block;color:var(--muted);font-size:.72rem}
.body{min-width:0}
.name{font-weight:500;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:3px;font-size:.8rem;color:var(--muted)}
.chip{font-size:.72rem;padding:1px 7px;border-radius:5px;font-weight:500;box-shadow:inset 0 0 0 1px color-mix(in srgb,currentColor 18%,transparent)}
.c-Warszawska{color:var(--warsz);background:var(--warsz-soft)}
.c-Czyżyny{color:var(--czyz);background:var(--czyz-soft)}
.c-Zdalnie{color:var(--online);background:var(--online-soft)}
.form{font-size:.72rem;color:var(--muted);border:1px solid color-mix(in srgb,var(--muted) 35%,transparent);border-radius:5px;padding:0 5px}
.cls.past{opacity:.45}
.cls.now .time{color:var(--accent);font-weight:500}
.off{color:var(--muted);font-size:.85rem;font-style:italic}
.note{font-size:.75rem;color:var(--muted)}
.subj{padding-block:14px;border-bottom:1px solid var(--line)}
.subj h3{font-size:1rem;font-weight:500;margin:0 0 6px;text-wrap:balance}
.subj table{width:100%;min-width:620px;table-layout:fixed;border-collapse:collapse;font-size:.82rem}
.subj td:nth-child(1){width:108px}.subj td:nth-child(2){width:142px}.subj td:nth-child(3){width:84px}.subj td:nth-child(4){width:130px}.subj td:nth-child(6){width:84px}
.subj td{padding:3px 8px 3px 0;vertical-align:top}
.subj td.m{white-space:nowrap;color:var(--muted)}
.tw{overflow-x:auto}
@media (max-width:480px){.day{grid-template-columns:1fr;gap:8px}.dhead{display:flex;gap:8px;align-items:baseline}.cls{grid-template-columns:80px 1fr}}
@media (prefers-reduced-motion:no-preference){.cls{transition:opacity .2s}}
</style>

/* Read the timetable workbook: sheet = {get(r,c), merges:[{s:{r,c},e:{r,c}}], maxR, maxC} (0-based). */
function parseSheet(sheet,opt){
  const G=opt.group, txt=(r,c)=>{const v=sheet.get(r,c);return v==null?"":String(v).replace(/\r\n?/g,"\n")};

        const i=ln[0].lastIndexOf(" — ");if(i<0)continue;
        const t=/(\d\d:\d\d)\s*[–-]\s*(\d\d:\d\d)\s*·\s*(.*)/.exec(ln[3]);if(!t)continue;
        const room=t[3].replace(/^s\.\s*/,"").trim();
        const k=[day,t[1],ln[0],ln[2]].join("|");if(seen.has(k))continue;seen.add(k);

const WAW=new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Warsaw",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false});
function wawParts(z){const t=Date.UTC(+z.slice(0,4),+z.slice(4,6)-1,+z.slice(6,8),+z.slice(9,11),+z.slice(11,13));const p={};WAW.formatToParts(new Date(t)).forEach(x=>p[x.type]=x.value);return {date:`${p.year}-${p.month}-${p.day}`,time:`${p.hour==="24"?"00":p.hour}:${p.minute}`}}

  const now=new Date().toISOString();let cal=DATA.calendar,rooms={...DATA.rooms};const groups={};
  for(const[id,g]of Object.entries(DATA.groups)){

  for(const g of Object.values(groups))g.classes=g.classes.map(c=>({...c,c:campusOf(c.r,rooms)})).sort((p,q)=>p.day-q.day||p.a.localeCompare(q.a));

  const cur=sum.groups[CUR]||{n:0}, others=Object.entries(sum.groups).filter(([id,g])=>id!==CUR&&g.n);
  $("chBody").innerHTML=`<h2 id="chTitle">Timetable updated from FK Planer</h2>
    <p>Checked ${esc(fmtStamp(sum.at))}. ${cur.n?`${cur.n} change${cur.n===1?"":"s"} for ${esc(glabel(CUR))}:`:`No changes for ${esc(glabel(CUR))}.`}</p>
    ${ul("New classes","add",cur.added)}${ul("Removed classes","del",cur.removed)}${ul("Room changes","",cur.moved)}
    ${sum.cal?"<p>The university calendar changed too (days off, replacement days or semester dates).</p>":""}
    ${others.length?`<p>Also updated: ${others.map(([id,g])=>`${esc(glabel(id))} (${g.n})`).join(", ")}.</p>`:""}`;
  const dlg=$("changes");
  try{dlg.showModal()}catch(e){dlg.setAttribute("open","")}
}
$("chClose").onclick=()=>{const d=$("changes");try{d.close()}catch(e){d.removeAttribute("open")}};

async function saveUpdate(next,sum){
  next.meta.updated=new Date().toISOString();
  const art=IS_ARTIFACT?await window.claude.use("artifact").catch(()=>null):null;
  if(art){
    ss.set(SS_CHANGES,JSON.stringify(sum));
    try{await art.publish(buildDoc(next));return}   // the page reloads and shows the pop-up
    catch(e){
      ss.del(SS_CHANGES);
      if(e&&e.code==="conflict")return;
      if(e&&(e.code==="rate_limited"||e.code==="upstream_error")){fkNote="FK Planer has changes, but saving failed. Try again in a minute";renderStatus();return}
    }
  }
  const ok=store.set(LS_KEY,JSON.stringify(next));
  DATA=next;fromDevice=ok;derive();renderAll();showChanges(sum);
}

let checking=false;
async function checkPlanner(auto){
  if(checking)return;
  const mcp=IS_ARTIFACT?await window.claude.use("mcp").catch(()=>null):null;
  if(!mcp){if(!auto)noHost();return}
  checking=true;store.set(LS_FKCHECK,String(Date.now()));
  fkNote="Checking FK Planer…";renderStatus();if(!auto)closePanel();
  try{
    const next=await fetchPlannerData(mcp), sum=summarize(next);
    if(!sum.total&&!sum.cal){fkNote=`FK Planer checked at ${hm(new Date())}, no changes`;renderStatus();return}
    fkNote="";await saveUpdate(next,sum);
  }catch(e){
    const c=e&&e.code;fkNote="";renderStatus();
    if(auto){
      if(c==="server_not_connected"||c==="not_granted"||c==="capability_disabled"||c==="capability_removed")return;
      fkNote=c==="cancelled"||c==="not_in_manifest"?"Automatic FK Planer check skipped":c==="parse"?String(e.message||"").replace(/, so nothing was changed\.$/,""):"Couldn't check FK Planer automatically";renderStatus();return;
    }
    if(c==="server_not_connected"||c==="not_granted"||c==="capability_disabled"||c==="capability_removed")noHost();
    else if(c==="cancelled")showPanel('<h2>Check cancelled</h2><p>Nothing was changed.</p><div class="row"><button class="btn" data-act="close">Close</button></div>');
    else if(c==="not_in_manifest")showPanel('<h2>Browser access is off for this page</h2><p>Allow the Claude browser for this page in its Permissions menu, then try again.</p><div class="row"><button class="btn" data-act="close">Close</button></div>');
    else showPanel(`<h2>Couldn't check FK Planer</h2><p>${esc((e&&e.message)||"Something went wrong.")}</p><p>You can still open <a href="${PLANNER_URL}" target="_blank" rel="noopener">FK Planer</a>, download “Excel — stacjonarne” and use Update source.</p><div class="row"><button class="btn" data-act="close">Close</button></div>`);
  }finally{checking=false}
}
function autoCheck(){
  const saved=ss.get(SS_CHANGES);
  if(saved){ss.del(SS_CHANGES);try{showChanges(JSON.parse(saved))}catch(e){}}
  if(!IS_ARTIFACT)return;
  const last=Number(store.get(LS_FKCHECK)||0);
  if(Date.now()-last<AUTO_EVERY)return;
  checkPlanner(true);
}

/* ---------- tabs, navigation ---------- */
function setTab(t){const w=t==="week";$("t-week").setAttribute("aria-selected",w);$("t-subj").setAttribute("aria-selected",!w);$("v-week").hidden=!w;$("v-subj").hidden=w;store.set("tab",t)}
$("t-week").onclick=()=>setTab("week");$("t-subj").onclick=()=>setTab("subj");
$("prev").onclick=()=>{wk--;renderWeek()};$("nextw").onclick=()=>{wk++;renderWeek()};
$("today").onclick=()=>{wk=defaultWeek();renderWeek()};

derive();wk=defaultWeek();renderAll();
if(store.get("tab")==="subj")setTab("subj");
autoCheck();
setInterval(()=>{renderCur();renderWeek()},60000);

/* PWA: offline cache (when hosted as its own site over HTTPS) */
if("serviceWorker" in navigator&&window.top===window&&document.querySelector('link[rel="manifest"]')){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
